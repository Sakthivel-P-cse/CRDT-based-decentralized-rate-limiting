services:
  node-1:
    build: .
    container_name: crdt-node-1
    environment:
      - NODE_ID=node-1
      - LISTEN_ADDR=:50051
      - PEERS=node-2:50051,node-3:50051
    ports:
      - "50051:50051"
    networks:
      - crdt-network

  node-2:
    build: .
    container_name: crdt-node-2
    environment:
      - NODE_ID=node-2
      - LISTEN_ADDR=:50051
      - PEERS=node-1:50051,node-3:50051
    ports:
      - "50052:50051"
    networks:
      - crdt-network

  node-3:
    build: .
    container_name: crdt-node-3
    environment:
      - NODE_ID=node-3
      - LISTEN_ADDR=:50051
      - PEERS=node-1:50051,node-2:50051
    ports:
      - "50053:50051"
    networks:
      - crdt-network

  redis:
    image: redis:7-alpine
    container_name: crdt-redis
    ports:
      - "6379:6379"
    networks:
      - crdt-network
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data

networks:
  crdt-network:
    driver: bridge

volumes:
  redis-data: