syntax = "proto3";

package ratelimiter;

option go_package = "github.com/sakthivel-p-cse/crdt-rate-limiter/proto";

service RateLimiter {
  // Existing client-facing Allow check
  rpc Allow(AllowRequest) returns (AllowResponse);

  // Gossip/membership endpoints
  rpc Ping(PingRequest) returns (PingResponse);
  rpc GossipState(GossipRequest) returns (GossipResponse);
}

message AllowRequest {
  string client_id = 1;
  int64 cost = 2;
}

message AllowResponse {
  bool allowed = 1;
  int64 remaining = 2;
}

// MemberInfo is a compact membership digest entry piggybacked on Ping/Ack
// payloads for SWIM-style transitive discovery. On receive, the recipient
// merges each entry into its local membership table using incarnation-number
// gating to avoid resurrecting dead nodes from stale gossip.
message MemberInfo {
  string node_id     = 1;
  string address     = 2;
  // status maps to gossip.Status: 0=Alive, 1=Suspect, 2=Dead
  int32  status      = 3;
  int32  incarnation = 4;
}

message PingRequest {
  string node_id        = 1;
  string listen_address = 2;
  // members carries a bounded subset of the sender's membership table,
  // enabling transitive peer discovery without a dedicated gossip RPC.
  repeated MemberInfo members = 3;
  string target_node_id = 4;
}

message PingResponse {
  bool ack = 1;
  // members carries the responder's membership digest back to the pinger.
  repeated MemberInfo members = 2;
}

message GossipRequest {
  string source_node_id = 1;
  // State is a map of client_id -> (epoch -> (node_id -> count))
  // We can represent this efficiently. Let's use nested maps for simplicity.
  map<string, ClientState> state = 2;
}

message ClientState {
  map<int64, EpochState> epochs = 1;
}

message EpochState {
  map<string, int64> node_counts = 1;
}

message GossipResponse {
  bool success = 1;
}
