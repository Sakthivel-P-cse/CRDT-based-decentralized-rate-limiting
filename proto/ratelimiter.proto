syntax = "proto3";

package ratelimiter;

option go_package = "github.com/sakthivel-p-cse/crdt-rate-limiter/proto";

import "google/protobuf/duration.proto";

enum Priority {
  PRIORITY_UNSPECIFIED = 0;
  PRIORITY_CRITICAL = 1;
  PRIORITY_STANDARD = 2;
  PRIORITY_BEST_EFFORT = 3;
}

service RateLimiter {
  rpc Allow(AllowRequest) returns (AllowResponse);
  rpc Ping(PingRequest) returns (PingResponse);
  rpc GossipState(GossipRequest) returns (GossipResponse);
}

message AllowRequest {
  string client_id = 1;
  int64 cost = 2;
  Priority priority = 3;
}

message AllowResponse {
  bool allowed = 1;
  int64 remaining = 2;
  string reason = 3;
  google.protobuf.Duration retry_after = 4;
}

message MemberInfo {
  string node_id     = 1;
  string address     = 2;
  int32  status      = 3;
  int32  incarnation = 4;
}

message PingRequest {
  string node_id        = 1;
  string listen_address = 2;
  repeated MemberInfo members = 3;
  string target_node_id = 4;
}

message PingResponse {
  bool ack = 1;
  repeated MemberInfo members = 2;
}

message GossipRequest {
  string source_node_id = 1;
  map<string, ClientState> state = 2;
}

message ClientState {
  map<int64, EpochState> epochs = 1;
}

message EpochState {
  map<string, int64> node_counts = 1;
}

message GossipResponse {
  bool success = 1;
}
